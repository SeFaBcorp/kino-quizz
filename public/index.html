/* v5: private three-try answers, multi-media actor/character clues */
.media-slots{display:grid;gap:10px;margin:4px 0}
.media-slot{display:grid;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,var(--accent) 8%)}

.media-help{font-size:10px;line-height:1.45;color:var(--muted)}

.quiz-media-item{min-width:0;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}

.quiz-media-item audio{width:100%;margin-top:6px}
.quiz-media-item iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#100d19}
.attempt-note{padding:11px 13px;border-radius:11px;background:#fff5dc;color:#765013;font-size:12px;font-weight:700;line-height:1.5}
.attempt-note.success{background:#e6f7ef;color:#13724d}
.attempt-hint{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:-3px}
.add-media-slot{border:1px dashed var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);font-size:11px;font-weight:800;color:var(--accent);cursor:pointer}

:root[data-theme="dark"] .attempt-note{background:#49391c;color:#ffe5a8}
:root[data-theme="dark"] .attempt-note.success{background:#16392f;color:#9be2c4}

/* v4: single-collection dashboard, open-answer gameplay and one-second clip alert */
.one-second-alert{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border:1px solid #edb84c;border-radius:15px;background:linear-gradient(110deg,#fff4d9,#fff9ec);color:#54360b}

.store-hero{position:relative;overflow:hidden;padding:30px;border-radius:23px;color:#fff;background:radial-gradient(circle at 83% 10%,rgba(255,255,255,.22),transparent 19rem),linear-gradient(118deg,#211a39,#5c3e9f 58%,#8a67fa)}.store-hero h1{margin:8px 0;font-size:clamp(28px,4vw,42px);color:white}.store-hero p{max-width:550px;color:rgba(255,255,255,.76)}.store-hero .eyebrow{color:#e3d8ff}.store-hero-icon{position:absolute;right:7%;top:12%;font-size:100px;opacity:.22}.store-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}.store-product{overflow:hidden}.store-product-image{height:190px;display:grid;place-items:center;background:linear-gradient(135deg,#f1ecfb,#fff4e9);color:#8868df;font-size:42px;overflow:hidden}.store-product-image img{width:100%;height:100%;object-fit:cover}.store-price{font-size:18px;color:var(--accent)}.store-desc{font-size:13px;min-height:38px}.store-cart{position:sticky;top:100px}.cart-total{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:17px}.cart-total b{font-size:22px}.support-card{max-width:700px}.support-orb{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:var(--tint);color:var(--accent);font-size:24px}

/* ===== v8: motion + 3D layer ===== */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.26;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-12vmax;top:-14vmax;background:#8f6bff}
.aurora i:nth-child(2){right:-16vmax;top:18vh;background:#ff8cae;animation-duration:32s;animation-delay:-8s;opacity:.18}
.aurora i:nth-child(3){left:28vw;bottom:-24vmax;background:#ffcf71;animation-duration:38s;animation-delay:-14s;opacity:.15}
:root[data-theme="dark"] .aurora i{opacity:.16}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .aurora i{opacity:.16}}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.15)}}

/* page entrance: sections rise in one after another */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}}
@keyframes flipIn{from{opacity:0;transform:perspective(1000px) rotateX(-20deg) translateY(24px)}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.86)}}
.wrap.enter>*>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.wrap.enter>*>*:nth-child(2){animation-delay:.07s}
.wrap.enter>*>*:nth-child(3){animation-delay:.14s}
.wrap.enter>*>*:nth-child(4){animation-delay:.21s}
.wrap.enter>*>*:nth-child(n+5){animation-delay:.28s}
.wrap.enter .stack>.card.pad.stack{animation-name:flipIn;animation-duration:.7s}
.wrap.enter .round-tile{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) backwards}
.wrap.enter .round-tile:nth-child(2){animation-delay:.05s}.wrap.enter .round-tile:nth-child(3){animation-delay:.1s}.wrap.enter .round-tile:nth-child(4){animation-delay:.15s}.wrap.enter .round-tile:nth-child(5){animation-delay:.2s}.wrap.enter .round-tile:nth-child(6){animation-delay:.25s}.wrap.enter .round-tile:nth-child(7){animation-delay:.3s}
.wrap.enter .cards>*,.wrap.enter .store-grid>*,.wrap.enter .dashboard-collections>*{animation:pop .55s cubic-bezier(.2,.9,.3,1.1) backwards}
.wrap.enter .cards>*:nth-child(2),.wrap.enter .store-grid>*:nth-child(2),.wrap.enter .dashboard-collections>*:nth-child(2){animation-delay:.07s}
.wrap.enter .cards>*:nth-child(3),.wrap.enter .store-grid>*:nth-child(3),.wrap.enter .dashboard-collections>*:nth-child(3){animation-delay:.14s}
.wrap.enter .cards>*:nth-child(n+4),.wrap.enter .store-grid>*:nth-child(n+4),.wrap.enter .dashboard-collections>*:nth-child(n+4){animation-delay:.21s}

/* 3D tilt with moving glare (mouse only; set by JS) */
.qcard,.qcard:hover,.round-tile,.round-tile:hover,.store-product,.store-product:hover,.leaderboard-card{
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
  transform-origin:50% 60%;will-change:transform}
.qcard:hover,.round-tile:hover,.store-product:hover{--ty:-6px}
.tilting{transition:transform .08s ease-out,box-shadow .25s,border-color .2s!important}
.qcard,.store-product,.leaderboard-card{position:relative}
.qcard:after,.round-tile:after,.store-product:after,.leaderboard-card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.38),transparent 55%);mix-blend-mode:soft-light}
.tilting:after{opacity:1}
.round-tile .tile-icon{transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.round-tile:hover .tile-icon{transform:translateY(-3px) rotate(-8deg) scale(1.12)}
.qcard:hover .film{animation:filmroll .9s linear infinite}
@keyframes filmroll{from{background-position:0 0,0 0}to{background-position:14px 0,0 0}}

/* hero: orbiting 3D ring of the seven rounds around the floating ticket */
.hero-art{perspective:1000px}
.search input[type=text]{padding:11px 14px 11px 40px}
.ring3d{position:absolute;left:50%;top:50%;width:62px;height:86px;margin:-43px 0 0 -31px;transform-style:preserve-3d;
  transform:rotateX(calc(-20deg + var(--hx,0deg)*.7)) rotateY(calc(var(--hy,0deg)*.5));transition:transform .25s ease-out}
.ring-spin{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 26s linear infinite}
.ring-spin i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;border-radius:12px;color:#fff;
  transform:rotateY(calc(var(--i)*51.4286deg)) translateZ(196px);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));
  box-shadow:0 10px 24px rgba(8,4,22,.35),inset 0 0 0 1px rgba(255,255,255,.35)}
.ring-spin i b{font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
@keyframes spin{to{transform:rotateY(360deg)}}
.art-ticket{position:relative;z-index:2;transform-style:preserve-3d;
  transform:rotate(8deg) rotateY(var(--hy,0deg)) rotateX(var(--hx,0deg));transition:transform .25s ease-out;animation:floaty 6s ease-in-out infinite}
.ticket-center{transform:translateZ(26px)}.ticket-play{transform:translateZ(18px)}
.art-orbit{z-index:0}
@keyframes floaty{50%{translate:0 -12px}}
.art-spark{animation:twinkle 2.6s ease-in-out infinite;z-index:3}.spark-b{animation-delay:-1.2s}
.art-dot{animation:floaty 4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(1.5) rotate(25deg);opacity:.55}}
.orbit-one{animation:orbit 30s linear infinite}.orbit-two{animation:orbit 20s linear infinite reverse}
@keyframes orbit{to{transform:rotate(360deg)}}

/* buttons, nav, badges */
.hero-btn{position:relative;overflow:hidden}
.hero-btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{55%,100%{transform:translateX(130%)}}
.btn:active{transform:scale(.96)!important}
.nav:hover svg{animation:wiggle .55s}
@keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.trophy{animation:trophy 5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes trophy{0%,100%{transform:perspective(200px) rotateY(-28deg)}50%{transform:perspective(200px) rotateY(28deg) translateY(-3px)}}
.brand-mark{animation:floaty 5s ease-in-out infinite}
.rank-line{transition:transform .2s,background .2s}.rank-line:hover{transform:translateX(5px);background:rgba(255,255,255,.12)}
.tile-icon,.empty-studio-mark,.lock-mark{animation:floaty 5s ease-in-out infinite}

/* gameplay feedback */

.attempt-note.success{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.opt.right{animation:pop .4s}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.overlay{animation:fadeIn .2s}.dlg{animation:dlgIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fadeIn{from{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:perspective(700px) rotateX(-14deg) translateY(18px) scale(.95)}}
.fx-canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}

}

.auth-alert,.auth-info{margin:0;padding:10px 13px;border-radius:11px;font-size:13px;font-weight:600;line-height:1.35}
.auth-alert{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 38%,var(--line));color:var(--bad)}
.auth-info{background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent-ink)}
.auth-alert:empty,.auth-info:empty{display:none}
.auth-tip{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.opt-card{display:grid;gap:11px;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.opt-card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:9px}
.opt-card h3 i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--tint)}
.opt-card p{margin:0;font-size:13px}
.opt-card .steps{font-size:13px;gap:6px}
.or-sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.or-sep:before,.or-sep:after{content:"";flex:1;height:1px;background:var(--line)}
.auth-done{display:grid;gap:12px;justify-items:center;text-align:center;padding:6px 0}
.auth-done .big-ic{font-size:44px}
.btn.big.link{display:inline-flex;align-items:center;text-decoration:none}
/* Pictures always sit in a frame of the same size: no stretching, no cut-off tops/bottoms, no giant alt text. */
.store-product-image{position:relative;height:auto;aspect-ratio:4/3;font-size:42px;line-height:1}
.store-product-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;font-size:0}
.store-product-image.broken img{display:none}
.quiz-media-item img,.quiz-media-item video{width:100%;height:clamp(220px,46vh,400px);max-height:none;object-fit:contain;object-position:center;font-size:0}
.quiz-media-item .img-fail{display:grid;place-items:center;height:clamp(160px,30vh,260px);border-radius:12px;background:#100d19;color:#b9b0d8;font-size:14px;text-align:center;padding:16px}
</style>

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var mem={};
function ld(k,d){try{var v=localStorage.getItem('kq_'+k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d}
/* Firebase mode is on only when firebase-config.js holds real keys; otherwise the app stays 100% local. */
var FB_ON=!!(window.KQ_CONFIG&&window.KQ_CONFIG.apiKey&&!/YOUR_/i.test(String(window.KQ_CONFIG.apiKey)));
function kq(){return FB_ON&&window.KQ&&window.KQ.on?window.KQ:null}
var REMOTE={news:{},cols:{},products:{},ranks:{},orders:{}},LOADED={},SENT={};
function stable(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x]});return r}return v})}
function sv(k,v,nosync){mem[k]=v;try{localStorage.setItem('kq_'+k,JSON.stringify(v))}catch(e){}if(!nosync&&FB_ON)kqPush(k,v)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s){return document.querySelector(s)}

/* Uploaded clue files are kept in IndexedDB, not localStorage, so larger videos
   and several actor images do not overflow the browser's small storage quota. */
var mediaDbPromise=null,mediaUrlCache={};
function mediaDB(){
 if(mediaDbPromise)return mediaDbPromise;
 mediaDbPromise=new Promise(function(resolve,reject){
  if(!window.indexedDB){reject(new Error('This browser does not support local media storage.'));return}
  var req=indexedDB.open('kinoquiz-media-v1',1);
  req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains('assets'))db.createObjectStore('assets')};
  req.onsuccess=function(){resolve(req.result)};req.onerror=function(){reject(req.error||new Error('Could not open media storage.'))};
 });
 return mediaDbPromise;
}
function saveMediaFile(file){
 return mediaDB().then(function(db){return new Promise(function(resolve,reject){
  var id='asset_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),tx=db.transaction('assets','readwrite');
  tx.objectStore('assets').put(file,id);tx.oncomplete=function(){resolve({ref:'idb://'+id,type:file.type||'',name:file.name||''})};tx.onerror=function(){reject(tx.error||new Error('Could not save uploaded media.'))};tx.onabort=function(){reject(tx.error||new Error('Media upload was cancelled.'))};
 })});
}
function mediaTypeFromUrl(url){
 var u=String(url||'').toLowerCase().split('?')[0].split('#')[0];
 if(/\.(png|jpe?g|gif|webp|avif|svg)$/.test(u))return'image/*';
 if(/\.(mp4|webm|mov|m4v|ogv)$/.test(u))return'video/*';
 if(/\.(mp3|m4a|wav|ogg|aac|flac)$/.test(u))return'audio/*';
 return'';
}
/* Any link or any file: tidy known share links, and for plain web pages ask the server for the page's preview picture. */
function normalizeMediaUrl(u){
 u=String(u||'').trim();var m;
 if((m=u.match(/^https?:\/\/(?:www\.)?imgur\.com\/(?!a\/|gallery\/)([A-Za-z0-9]{5,8})\/?$/i)))return'https://i.imgur.com/'+m[1]+'.jpg';
 if(/^https?:\/\/(?:www\.)?dropbox\.com\//i.test(u)&&!/[?&]raw=1/.test(u))return u.replace(/[?&]dl=0/,'').replace(/([?&])dl=1/,'$1raw=1')+(/\?/.test(u.replace(/[?&]dl=0/,''))?'&':'?')+'raw=1';
 return u;
}
function isDirectMedia(u){return !!(mediaTypeFromUrl(u)||youtubeId(u)||spotifyEmbedUrl(u)||/drive\.google\.com\//i.test(u)||/^https?:\/\/(?:i\.imgur\.com|upload\.wikimedia\.org|images\.unsplash\.com|firebasestorage\.googleapis\.com)\//i.test(u))}
async function smartMedia(url,forceImage){
 url=normalizeMediaUrl(url);var ref={ref:url,type:mediaTypeFromUrl(url),name:''};
 if(isDirectMedia(url)||!kq()||!kq().mediaInfo)return ref;
 try{var r=await kq().mediaInfo(url);if(r&&r.image)return{ref:r.image,type:'image/*',name:''};if(r&&r.media)return{ref:r.media,type:r.type||'',name:''}}catch(e){}
 return ref;
}
async function uploadMediaFile(file){
 if(file.size>25*1024*1024)throw new Error(L('Fayl 25 MB dan kichik bo‘lsin.','Файл должен быть не больше 25 МБ.','Each uploaded file must be 25 MB or smaller.'));
 return kq()?await kq().upload(file):await saveMediaFile(file);
}
function youtubeId(url){
 try{var u=new URL(url);var h=u.hostname.replace(/^www\./,'').toLowerCase(),id='';
  if(h==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';
  else if(h==='youtube.com'||h==='m.youtube.com'||h==='music.youtube.com'){id=u.searchParams.get('v')||'';if(!id){var m=u.pathname.match(/\/(?:embed|shorts|live)\/([\w-]+)/);if(m)id=m[1]}}
  return /^[\w-]{11}$/.test(id)?id:'';
 }catch(e){return''}
}
function spotifyEmbedUrl(url){
 try{
  var u=new URL(url),h=u.hostname.replace(/^www\./,'').toLowerCase();
  if(h!=='open.spotify.com'&&h!=='play.spotify.com')return '';
  var m=u.pathname.match(/^\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)\/?/);
  return m?'https://open.spotify.com/embed/'+m[1]+'/'+m[2]+'?utm_source=generator':'';
 }catch(e){return ''}
}
function resolveMediaAsset(asset){
 if(!asset)return Promise.resolve(null);
 if(typeof asset==='string')asset={ref:asset,type:mediaTypeFromUrl(asset)};
 var ref=String(asset.ref||'');
 if(ref.indexOf('idb://')!==0)return Promise.resolve({src:ref,type:asset.type||mediaTypeFromUrl(ref),name:asset.name||''});
 var id=ref.slice(6);
 return mediaDB().then(function(db){return new Promise(function(resolve,reject){
  var tx=db.transaction('assets','readonly'),req=tx.objectStore('assets').get(id);
  req.onsuccess=function(){var blob=req.result;if(!blob){resolve(null);return}var src=mediaUrlCache[id]||(mediaUrlCache[id]=URL.createObjectURL(blob));resolve({src:src,type:asset.type||blob.type||'',name:asset.name||''})};
  req.onerror=function(){reject(req.error||new Error('Could not load uploaded media.'))};
 })});
}
function mediaAssetHtml(asset){
 if(!asset||!asset.src)return'';
 var src=esc(asset.src),yt=youtubeId(asset.src),sp=spotifyEmbedUrl(asset.src),type=String(asset.type||'').toLowerCase();
 if(yt)return'<div class="quiz-media-item media-embed"><iframe src="https://www.youtube-nocookie.com/embed/'+yt+'?rel=0&modestbranding=1&playsinline=1" title="YouTube clue" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><div class="media-help">YouTube player · play and control the clue here</div></div>';
 if(sp)return'<div class="quiz-media-item media-embed spotify-embed"><iframe src="'+esc(sp)+'" title="Spotify music clue" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe><div class="media-help">Spotify player · sign in to Spotify if requested</div></div>';
 if(type.indexOf('image/')===0||(!type&&/\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i.test(asset.src)))return'<div class="quiz-media-item"><img src="'+src+'" alt="Quiz clue"></div>';
 if(type.indexOf('video/')===0||(!type&&/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(asset.src)))return'<div class="quiz-media-item"><video controls playsinline preload="metadata" src="'+src+'"></video></div>';
 if(type.indexOf('audio/')===0||(!type&&/\.(mp3|m4a|wav|ogg|aac|flac)(\?|#|$)/i.test(asset.src)))return'<div class="quiz-media-item"><audio controls preload="none" src="'+src+'"></audio></div>';
 // Unknown direct media URLs stay inside the question. Drive share links use the preview endpoint.
 var embedSrc=asset.src,drive=String(asset.src).match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/),driveOpen=String(asset.src).match(/drive\.google\.com\/(?:open|uc)\?.*?(?:id=)([A-Za-z0-9_-]+)/);
 if(drive||driveOpen)embedSrc='https://drive.google.com/file/d/'+(drive?drive[1]:driveOpen[1])+'/preview';
 return'<div class="quiz-media-item media-embed"><iframe src="'+esc(embedSrc)+'" title="Embedded quiz clue" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
}

 else if(i===4){media='<div class="media-slots"><p class="media-help">'+(uz?'5-bosqich: xohlasangiz rasm, video yoki audio yuklang yoki YouTube / boshqa media havolasini kiriting.':ru?'Раунд 5: загрузите изображение, видео или аудио либо добавьте ссылку YouTube или другую медиа-ссылку.':'Round 5: upload an image, video or audio file, or add a YouTube / other media link.')+'</p>'+mediaSlot(i,j,0,(uz?'Qahramon mediası (ixtiyoriy)':ru?'Медиа персонажа (необязательно)':'Character media (optional)'))+'</div>'}
 else if(i===1||i===2||i===6){
  var ml=i===1?(uz?'Poster / sahna rasmi URL':ru?'URL постера или кадра':'Poster / scene image URL'):(i===2?(uz?'YouTube yoki Spotify havolasi (yoki audio fayl URL)':ru?'Ссылка YouTube или Spotify (или URL аудиофайла)':'YouTube or Spotify link (or direct audio file URL)'):(uz?'Video URL (YouTube yoki MP4; faqat 1 soniya)':ru?'Ссылка на видео (YouTube или MP4; только 1 секунда)':'Video URL (YouTube or MP4; only 1 second)'));
  var ph=i===2?'https://youtu.be/...  or  https://open.spotify.com/track/...':(i===6?'https://youtu.be/...  or  https://...mp4':'https://...');
  media='<label class="media-field">'+ml+'<input type="url" name="media'+i+'_'+j+'" placeholder="'+ph+'" inputmode="url"></label><label class="media-field">'+(uz?'Yoki fayl yuklang':ru?'Или загрузите файл':'Or upload a file')+'<input type="file" name="upload'+i+'_'+j+'" accept="'+(i===1?'image/*':i===2?'audio/*':'video/*')+'"></label>'+(i===2?'<p class="media-help">'+(uz?'YouTube va Spotify player savol ichida ko‘rinadi. Spotify track, album yoki playlist havolasini qo‘ying.':ru?'Проигрыватель YouTube и Spotify появится прямо в вопросе. Вставьте ссылку на трек, альбом или плейлист Spotify.':'YouTube and Spotify players appear inside the question. Paste a Spotify track, album or playlist link.')+'</p>':(i===6?'<p class="media-help">'+(uz?'YouTube havolasi ham qo‘llanadi. Video player savol ichida ochiladi va 1 soniyadan keyin to‘xtaydi.':ru?'Поддерживается ссылка YouTube. Видео откроется прямо в вопросе и остановится через 1 секунду.':'YouTube links are supported. The video opens inside the question and stops after one second.')+'</p>':''));
 }
 return '<div class="round-question"><div class="row between"><h4>'+(uz?'SAVOL':ru?'ВОПРОС':'QUESTION')+' '+String(j+1).padStart(2,'0')+'</h4><button class="btn sm danger" type="button" data-a="removeroundq" data-v="'+i+'" aria-label="'+remove+'">'+remove+'</button></div><label>'+qlabel+'<textarea name="q'+i+'_'+j+'" placeholder="'+prompts[i]+'" required></textarea></label>'+media+'<label>'+alabel+'<input type="text" name="answer'+i+'_'+j+'" placeholder="'+answerHint+'" required></label><p class="media-help">'+(uz?'Muqobil javoblar uchun | belgisidan foydalaning, masalan: Garri Potter | Harry Potter':ru?'Для альтернативных ответов используйте |, например: Гарри Поттер | Harry Potter':'Accept alternatives with | , e.g. Spider-Man | Spiderman. Small typos in long titles are forgiven.')+'</p></div>';
}
function renumberRound(box,ri){Array.prototype.forEach.call(box.querySelectorAll('.round-question'),function(card,j){var h4=card.querySelector('h4');h4.textContent=h4.textContent.replace(/\d+\s*$/,String(j+1).padStart(2,'0'));card.querySelectorAll('[name]').forEach(function(el){var m=el.name.match(new RegExp('^(q|media|upload|answer)'+ri+'_\\d+(?:_(\\d+))?$'));if(m)el.name=m[1]+ri+'_'+j+(m[2]!==undefined?'_'+m[2]:'')});var add=card.querySelector('[data-a=addactorslot]');if(add)add.dataset.v=String(j)})}

function supportHandle(raw){var v=String(raw||SUPPORT_USER).trim().replace(/^@/,'');var m=v.match(/(?:https?:\/\/)?(?:www\.)?t\.me\/([A-Za-z0-9_]+)/i);if(m)v=m[1];return /^[A-Za-z0-9_]{5,32}$/.test(v)?v:SUPPORT_USER}

   items.push({cat:it.cat,q:it.q,answer:it.answer||'',media:it.media||'',mediaItems:assets});

function normalizeAnswer(value){return String(value||'').toLocaleLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[“”‘’'".,!?;:()\[\]{}]/g,'').replace(/[-–—_&]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){var m=a.length,n=b.length,row=[],i,j,prev,tmp;for(j=0;j<=n;j++)row[j]=j;for(i=1;i<=m;i++){prev=row[0];row[0]=i;for(j=1;j<=n;j++){tmp=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a.charAt(i-1)===b.charAt(j-1)?0:1));prev=tmp}}return row[n]}
/* Accepts alternatives written as "A | B", ignores a leading article, forgives a small typo in long titles (never when digits are involved, so "Toy Story 2" is not "Toy Story 3"). */
function answerMatches(input,answer){

var FX_REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var fxLastKey='',fxTilt=null,fxCanvas=null,fxParts=[],fxRaf=0;
var FX_COLORS=['#7657F6','#F18A9B','#FFCF71','#35A8A0','#4E8FE8','#FFFFFF'];
var FX_TILT='.qcard,.round-tile,.store-product,.leaderboard-card';
function ringHtml(){var cols=['#F4B942','#F06B86','#8B6CF6','#35A8A0','#4E8FE8','#E28A45','#D65FA4'],gl=['✦','▧','♫','✧','◈','❝','▶'];return cols.map(function(c,i){return '<i style="--i:'+i+';--c:'+c+'"><b>'+gl[i]+'</b></i>'}).join('')}
function fxResetTilt(el){if(!el)return;el.classList.remove('tilting');['--rx','--ry','--mx','--my'].forEach(function(k){el.style.removeProperty(k)})}
document.addEventListener('pointermove',function(e){
 if(FX_REDUCE||e.pointerType!=='mouse')return;
 var tg=e.target&&e.target.closest?e.target:null;if(!tg)return;
 var hero=tg.closest('.dashboard-hero'),art=hero&&document.getElementById('heroart');
 if(art){var hr=hero.getBoundingClientRect();art.style.setProperty('--hy',(((e.clientX-hr.left)/hr.width-.5)*28).toFixed(1)+'deg');art.style.setProperty('--hx',((-((e.clientY-hr.top)/hr.height-.5))*22).toFixed(1)+'deg')}
 var el=tg.closest(FX_TILT);
 if(fxTilt&&fxTilt!==el)fxResetTilt(fxTilt);
 fxTilt=el;if(!el)return;
 var r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 el.classList.add('tilting');
 el.style.setProperty('--ry',((px-.5)*13).toFixed(2)+'deg');el.style.setProperty('--rx',((.5-py)*13).toFixed(2)+'deg');
 el.style.setProperty('--mx',(px*100).toFixed(1)+'%');el.style.setProperty('--my',(py*100).toFixed(1)+'%');
},{passive:true});

function fxCanvasEl(){
 if(!fxCanvas){fxCanvas=document.createElement('canvas');fxCanvas.className='fx-canvas';fxCanvas.setAttribute('aria-hidden','true');document.body.appendChild(fxCanvas);window.addEventListener('resize',fxSize)}

}
function fxSize(){if(!fxCanvas)return;var d=Math.min(window.devicePixelRatio||1,2);fxCanvas.width=Math.round(innerWidth*d);fxCanvas.height=Math.round(innerHeight*d);fxCanvas.getContext('2d').setTransform(d,0,0,d,0,0)}
function fxSpawn(x,y,n,angle,spread,power){
 for(var i=0;i<n;i++){var a=angle+(Math.random()-.5)*spread,sp=power*(.45+Math.random()*.75);
  fxParts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,w:5+Math.random()*7,h:3+Math.random()*5,c:FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)],life:90+Math.random()*60})}
 if(!fxRaf)fxRaf=requestAnimationFrame(fxLoop);
}
function fxLoop(){
 var c=fxCanvas;if(!c){fxRaf=0;return}
 var g=c.getContext('2d');g.clearRect(0,0,innerWidth,innerHeight);
 fxParts=fxParts.filter(function(p){return p.life>0&&p.y<innerHeight+30});
 fxParts.forEach(function(p){p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;g.save();g.globalAlpha=Math.min(1,p.life/30);g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
 if(fxParts.length)fxRaf=requestAnimationFrame(fxLoop);else{fxRaf=0;g.clearRect(0,0,innerWidth,innerHeight)}
}

}
function fxConfetti(){
 if(FX_REDUCE)return;fxCanvasEl();
 fxSpawn(innerWidth*.12,innerHeight*.75,80,-Math.PI/3,.9,17);
 fxSpawn(innerWidth*.88,innerHeight*.75,80,-Math.PI*2/3,.9,17);
