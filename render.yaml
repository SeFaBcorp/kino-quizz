services:
  - type: web
    name: kinoquiz-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - { key: TELEGRAM_BOT_TOKEN,       sync: false }
      - { key: WEBHOOK_SECRET,           sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT, sync: false }
      - { key: OWNER_EMAILS,             value: "egabehru0@gmail.com,dilshodabdurahimov12@gmail.com" }
      - { key: SITE_ORIGIN,              value: "https://kino-quizz.onrender.com" }
      - { key: AI_PROVIDER,              value: anthropic }
      - { key: ANTHROPIC_API_KEY,        sync: false }
      - { key: AI_MODEL,                 value: claude-sonnet-5-5 }
      - { key: OPENAI_API_KEY,           sync: false }
      - { key: OPENAI_MODEL,             sync: false }
      - { key: NEWS_REFRESH_MIN,         value: "60" }
      - { key: NEWS_AI_MODEL,            sync: false }
      - { key: PAY_CARD,                 sync: false }
      - { key: PAY_CARD_HOLDER,          sync: false }
      - { key: PAY_NOTE,                 sync: false }
      - { key: USD_TO_UZS,               sync: false }
      - { key: MAIL_WEBHOOK_URL,         sync: false }
      - { key: MAIL_WEBHOOK_SECRET,      sync: false }
      - { key: BREVO_API_KEY,            sync: false }
      - { key: MAIL_FROM,                sync: false }
      - { key: MAIL_FROM_NAME,           value: KinoQuiz }
      - { key: SMTP_HOST,                sync: false }
      - { key: SMTP_USER,                sync: false }
      - { key: SMTP_PASS,                sync: false }
